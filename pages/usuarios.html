<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/output.css">
    <link rel="icon" href="../assets/img/favicon.png" type="image/png">
    <title>Usuarios - Estacionamiento UCN CQBO</title>
    <script>
        function getSession() {
            try { return JSON.parse(localStorage.getItem("ucn_session")) || null; } catch { return null; }
        }
        const session = getSession();
        if (!session || session.role !== "admin") {
            window.location.replace("../index.html");
        }
    </script>
</head>

<body class="app-body">
    <header class="app-header">
        <img src="../assets/img/logo_ucn.png" alt="Logo UCN" class="app-logo">
        <h1 class="app-title" data-i18n="header_title">Estacionamientos UCN sede Coquimbo</h1>

        <div class="app-header-actions">
            <button id="btn-lang" class="app-lang-button" onclick="toggleLang()">EN</button>
            <button id="btn-theme" class="app-theme-button" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <nav class="app-nav">
        <ul class="app-nav-list">
            <li><a href="../index.html" class="app-nav-link" data-i18n="nav_inicio">Inicio</a></li>
            <li><a href="sectores.html" class="app-nav-link" data-i18n="nav_sectores">Sectores</a></li>
            <li><a href="administracion.html" class="app-nav-link" data-i18n="nav_admin">Administración</a></li>
            <li><a href="usuarios.html" class="app-nav-link-active">Usuarios</a></li>
            <li><a href="contacto.html" class="app-nav-link" data-i18n="nav_contacto">Contacto y ubicación</a></li>
        </ul>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto p-4 md:p-8">
        <section class="mb-6 flex flex-col md:flex-row justify-between gap-4">
            <div>
                <h2 class="text-2xl font-bold text-blue-900 dark:text-blue-400">Usuarios</h2>
                <p class="text-gray-600 dark:text-gray-400 text-sm">Gestiona cuentas, roles y estado de acceso.</p>
            </div>
            <button id="btn-refresh-users" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition-colors text-sm">
                Actualizar
            </button>
        </section>

        <section class="bg-white dark:bg-gray-800 rounded shadow border border-gray-200 dark:border-gray-700 p-4 mb-6">
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-4">Crear usuario</h3>
            <form id="user-create-form" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input id="user-name" type="text" required placeholder="Nombre" class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white">
                <input id="user-email" type="email" required placeholder="Correo" class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white">
                <input id="user-password" type="password" required placeholder="Contraseña" class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white">
                <select id="user-role" class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white">
                    <option value="user">Usuario</option>
                    <option value="staff">Staff</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition-colors">
                    Crear
                </button>
            </form>
            <p id="user-form-msg" class="mt-3 text-sm hidden"></p>
        </section>

        <section class="bg-white dark:bg-gray-800 rounded shadow overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-blue-50 dark:bg-gray-700 text-blue-900 dark:text-blue-300 border-b border-blue-200 dark:border-gray-600">
                            <th class="p-3 font-semibold">Nombre</th>
                            <th class="p-3 font-semibold">Correo</th>
                            <th class="p-3 font-semibold">Rol</th>
                            <th class="p-3 font-semibold">Estado</th>
                            <th class="p-3 font-semibold text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="text-gray-700 dark:text-gray-300">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500 dark:text-gray-400">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/usuarios.js?v=1"></script>
</body>

</html>
