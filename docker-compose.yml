services:
  db:
    image: postgres:15
    env_file: ./backend/database/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucn_admin -d estacionamiento_ucn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/database/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   

  simulator:
    build: ./backend
    env_file: ./backend/database/.env
    command: ["python", "-u", "simulate_parking.py", "--forever", "--delay", "5", "--initial-delay", "10"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./pages:/usr/share/nginx/html/pages:ro
      - ./scripts:/usr/share/nginx/html/scripts:ro
    depends_on:
      - backend

volumes:
  postgres_data:
