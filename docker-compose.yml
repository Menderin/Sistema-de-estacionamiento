services:
  db:
    image: postgres:15
    env_file: ./backend/database/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucn_admin -d estacionamiento_ucn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/database/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   

volumes:
  postgres_data: